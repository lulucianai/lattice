# Cloudflare Tunnel — public HTTPS URL for the dashboard without opening any port.
# Setup:
#   cloudflared tunnel login
#   cloudflared tunnel create lattice            # note the tunnel UUID + creds file
#   cloudflared tunnel route dns lattice lattice.yourdomain.com
#   cp this file to ~/.cloudflared/config.yml (edit UUID + hostname), then:
#   cloudflared service install                  # runs it 24/7 as a service

tunnel: <TUNNEL_UUID>
credentials-file: /root/.cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: lattice.yourdomain.com
    service: http://localhost:3737
  - service: http_status:404
